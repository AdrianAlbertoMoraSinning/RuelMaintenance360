name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run test:auth
      - run: npm run test:operator
      - run: npm run test:tasks
      - run: npm run test:assets
      - run: npm run test:materials
      - run: npm run build
