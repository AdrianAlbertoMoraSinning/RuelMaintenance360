[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."part-photo-match-local"]
  external_node_modules = ["sharp", "@techstark/opencv-js"]
  included_files = ["node_modules/@img/**", "node_modules/@techstark/opencv-js/dist/**"]
